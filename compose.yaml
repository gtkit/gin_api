# compose.yaml —— 仅用于本地开发与测试；默认依赖，app profile显式启动应用。
#
# 这不是生产部署方案，也不替代已冻结的 deployment.sh / .gitlab-ci.yml。
# 默认仅MySQL与Redis；显式应用入口见make dev-app-up/dev-app-up-existing。
# 初次使用先准备隔离配置、临时钥和既有迁移，不自动对已有库执行DDL。
#
# 三条硬约束：
#   1. **只绑 127.0.0.1**：绑 0.0.0.0 会把无密码/弱密码的开发库暴露到局域网，
#      在咖啡馆或共享办公网络里就是一个开放的数据库端口。
#   2. **密码来自本地未跟踪的 .env**：模板不含任何真实密码。
#   3. **版本固定**：浮动 tag 会让"本地能过、CI 不过"变成无法复现的问题。
#
# 用法：
#   cp compose.env.example .env    # 填本地密码；.env 已被 .gitignore 排除
#   make dev-up                    # 拉起并等待健康
#   make dev-down                  # 停止，**保留数据卷**
#   make dev-reset                 # 带二次确认地删除数据卷

services:
  mysql:
    # 与 make migrate-verify 使用同一版本：门禁与本地环境必须一致，
    # 否则"本地能跑通的迁移在门禁里失败"会变成经常性的困惑。
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:?set DEV_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DEV_MYSQL_DATABASE:-gin_api_dev}
    ports:
      # 只绑回环：开发库通常口令很弱，绝不能对局域网可见。
      - "127.0.0.1:${DEV_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 必须用真实连接而不是 mysqladmin ping：镜像初始化期会先起一个临时服务器，
      # 那时 ping 就已经成功——那是假就绪信号，随后临时服务器会被关掉。
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--requirepass", "${DEV_REDIS_PASSWORD:?set DEV_REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${DEV_REDIS_PASSWORD}

  app:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Make从project.mk注入身份；未注入时由Dockerfile拒绝空名称。
        APP_NAME: ${DEV_APP_NAME:-}
        GOPROXY: ${DEV_GOPROXY:-https://proxy.golang.org,direct}
        BUILD_COMMIT: ${DEV_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${DEV_BUILD_TIME:-unknown}
    user: "${DEV_APP_UID:-1000}:${DEV_APP_GID:-1000}"
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        uid="$$(id -u)";
        test "$$uid" -gt 0 || { echo "app profile refuses UID 0" >&2; exit 1; };
        exec /app/bin/server "$$@"
      - compose-app
    command: [server]
    environment:
      APP_ROOT: /app
      APP_ENV: dev
      APP_APPLICATION__HOST: 0.0.0.0
      APP_APPLICATION__PORT: "8008"
      APP_APPLICATION__ISHTTPS: "false"
      APP_APPLICATION__DRAIN_WAIT_SECONDS: "5"
      APP_LOG__PATH: /app/logs/app
      APP_DATABASE__HOST: ${DEV_APP_DB_HOST:-mysql}
      APP_DATABASE__PORT: "${DEV_APP_DB_PORT:-3306}"
      APP_DATABASE__NAME: ${DEV_APP_DB_NAME:-${DEV_MYSQL_DATABASE:-gin_api_dev}}
      APP_DATABASE__USERNAME: ${DEV_APP_DB_USER:-root}
      # 单横线保留“显式空密码”，未设置时才继承依赖服务的口令。
      APP_DATABASE__PASSWORD: ${DEV_APP_DB_PASSWORD-${DEV_MYSQL_ROOT_PASSWORD}}
      APP_REDIS__ADDR: ${DEV_APP_REDIS_ADDR:-redis:6379}
      APP_REDIS__PASSWORD: ${DEV_APP_REDIS_PASSWORD-${DEV_REDIS_PASSWORD}}
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-8008}:8008"
    volumes:
      - type: bind
        source: ${DEV_APP_CONFIG:-./config/env/env.yml}
        target: /app/config/env/env.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEV_APP_PEM_DIR:-./config/pem}
        target: /app/config/pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEV_APP_LOG_DIR:-./logs}
        target: /app/logs
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8008/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 3m

volumes:
  # 具名卷而非匿名卷：dev-down 之后数据仍在，重新 up 不必重建库。
  # 想真正清空必须走带二次确认的 dev-reset。
  # **不写死卷名**：Compose 会按项目名加前缀，从而让每个派生项目各有一份数据。
  #
  # 写死的后果里，冲突还算好的——更糟的是两个项目**共享同一个卷**：
  # 那不会报错，只会让一个项目读到另一个项目的库。
  mysql-data:
  redis-data:
