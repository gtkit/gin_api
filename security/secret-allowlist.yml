# 密钥扫描的**假阳性**登记表（被 git 跟踪）。
#
# 与漏洞豁免严格分开：真实密钥泄漏**不可豁免**——发现即必须轮换并清理。
# 本表只登记已经人工确认为假阳性的 finding。
#
# 每条必须完整填写，缺一即门禁失败：
#   rule        Gitleaks rule ID
#   fingerprint 稳定指纹（或 path + 规则的组合）
#   owner       确认人
#   reason      为什么判定为假阳性
#   expires     到期日（YYYY-MM-DD）
#
# 过期、字段不全、以及**已不再命中**的陈旧条目均失败——
# 后者会让登记表逐渐变成一份没人再核对的清单。

allowlist:
  - rule: generic-api-key
    fingerprint: "3481e40ecdc11748e0a8c4af19f920f07ff98a70:internal/ratelimit/ratelimit_test.go:generic-api-key:235"
    owner: xiaozhaofu
    reason: >-
      测试占位串，不是任何真实系统的凭据：值为 "0123456789abcdef0123456789abcdef"，
      只在 _test.go 中作为 KeyBuilder 的长度下限样本，从未出现在配置或生产代码里。
      当前工作区已把它换成可读的低熵字符串以消除成因，但历史 commit 中的记录
      无法在不改写历史的前提下移除——而为一个从来不是凭据的字符串改写历史，
      代价远大于收益。
    expires: 2027-08-31
  - rule: generic-api-key
    fingerprint: "3481e40ecdc11748e0a8c4af19f920f07ff98a70:internal/router/ratelimit_chain_test.go:generic-api-key:18"
    owner: xiaozhaofu
    reason: >-
      与上一条同一成因、同一字符串，位于路由层的限流链路测试。
    expires: 2027-08-31
  - rule: generic-api-key
    fingerprint: "/scan/internal/pkg/verifycode/verifycode_test.go:generic-api-key:335"
    owner: xiaozhaofu
    reason: >-
      **匹配到的不是任何凭据，而是一段源码文本**：该行是一次前缀断言，
      规则把「变量名 + 逗号 + 常量名 + 引号」这个形状误判成给该变量赋了一个密钥，
      而被"泄漏"的值其实就是那个常量的标识符本身。该行所在的测试恰恰在断言
      派生出的 Redis 键不含明文手机号，与密钥无关：无值可轮换，也无处可清理。
      注意本条理由**刻意不复现那段文本**——引用它会让登记表自身再次命中同一规则，
      于是"登记一个假阳性"反而制造出一个新的假阳性。
    expires: 2027-08-31
  - rule: generic-api-key
    fingerprint: "134fe8d66e44e4ffb21b123a99f0eb2d7dca309c:internal/pkg/verifycode/verifycode_test.go:generic-api-key:331"
    owner: xiaozhaofu
    reason: >-
      与上一条同一处代码、同一成因，出现在全历史扫描里（commit 134fe8d）。
      同样不是凭据，而是被规则误判的常量名。
    expires: 2027-08-31
