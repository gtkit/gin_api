# 漏洞豁免登记表（**被 git 跟踪**）。
#
# 为什么必须入库：豁免不是工具痕迹，而是团队的安全决策记录。放在未跟踪目录会让
# 每个开发者的门禁结果不同，"负责人"与"到期日"也无法被任何人审计——那等于豁免不存在。
#
# 每条必须完整填写下列字段，缺一即门禁失败：
#   scanner    govulncheck | trivy
#   id         CVE-… / GO-… / Trivy ID
#   component  受影响组件
#   version    受影响版本
#   owner      负责人
#   reason     为什么暂缓
#   expires    到期日（YYYY-MM-DD），到期未处理即门禁失败
#
# 三类情形一律失败，不接受豁免：
#   * 扫描器执行或解析失败（那是门禁本身坏了，不是"已知风险"）；
#   * 已过期的豁免；
#   * **陈旧豁免**——不再命中任何 finding 的条目必须删除，否则登记表会变成一份
#     无人清理、越来越长、没人再认真看的清单。
#
# 密钥 finding 不走本表：真实密钥泄漏不可豁免，只允许对已人工确认的假阳性
# 在 security/secret-allowlist.yml 中登记。

waivers: []
